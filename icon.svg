<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1719" />
      <stop offset="100%" stop-color="#070a0b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56c2a6" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#56c2a6" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Spiral / Focus Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#56c2a6" stroke-width="3" stroke-dasharray="8 12" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="16 14" stroke-opacity="0.45"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#818cf8" stroke-width="3" stroke-opacity="0.4"/>
  
  <!-- Central Glowing Orb -->
  <circle cx="256" cy="256" r="82" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="6" filter="url(#shadow)"/>
  
  <!-- Lightning Bolt Symbol -->
  <path d="M266 172 L206 272 L250 272 L236 342 L312 242 L268 242 Z" 
        fill="url(#boltGrad)" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#shadow)"/>
</svg>
